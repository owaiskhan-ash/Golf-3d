<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Monterey Links 3D — Hyper-Realistic Coastal Golf Simulation</title>
    <link rel="preload" href="/models/golfer.glb" as="fetch" />
  </head>
  <body class="bg-slate-950 text-slate-100 overflow-hidden select-none">
    <div id="root">
      <!-- Static boot splash: visible instantly while the JS bundle downloads.
           React replaces this with the live progress-driven SplashScreen. -->
      <style>
        @keyframes splash-shimmer {
          0% { transform: translateX(-110%); }
          100% { transform: translateX(260%); }
        }
      </style>
      <div style="position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020617;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
        <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 62% 46% at 50% 42%, rgba(16,185,129,0.10), transparent 70%);"></div>
        <div style="position:relative;margin-bottom:28px;display:flex;height:64px;width:64px;align-items:center;justify-content:center;border-radius:9999px;border:1px solid rgba(52,211,153,0.25);background:rgba(16,185,129,0.10);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        </div>
        <div style="font-size:14px;font-weight:700;letter-spacing:0.38em;text-transform:uppercase;color:#ffffff;">Monterey <span style="color:#6ee7b7;">Links</span></div>
        <div style="margin-top:6px;font-size:10px;font-weight:500;letter-spacing:0.22em;text-transform:uppercase;color:#64748b;">Championship Coastal Golf</div>
        <div style="margin-top:40px;width:240px;max-width:70vw;">
          <div style="height:3px;width:100%;overflow:hidden;border-radius:9999px;background:rgba(255,255,255,0.10);">
            <div style="height:100%;width:42%;border-radius:9999px;background:linear-gradient(to right,#34d399,#38bdf8);animation:splash-shimmer 1.4s ease-in-out infinite;"></div>
          </div>
          <div style="margin-top:12px;font-size:10px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:#94a3b8;">Loading…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
